// ---------------------------------------------------------------------
// Rendering. You normally do not need to touch anything below this line.
// ---------------------------------------------------------------------
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function readingList(list) {
  return (list || [])
    .map(([title, url]) => `<a href="${esc(url)}">${esc(title)}</a>`)
    .join("<br>\n");
}

function topicCell(row) {
  let html = row.italic ? `<i>${esc(row.topic)}</i>` : esc(row.topic);
  if (row.pdf) html += ` <a href="${esc(row.pdf)}">[pdf]</a>`;
  if (row.note) html += `<br><i>${esc(row.note)}</i>`;
  if (row.due) html += `<br><b>${esc(row.due)}</b>`;
  return html;
}

function requiredCell(row) {
  return (row.required && row.required.length) ? readingList(row.required) : "&nbsp;";
}

function plainCell(list) {
  return (list && list.length) ? readingList(list) : "&nbsp;";
}

(function renderSchedule() {
  const body = document.getElementById("schedule-body");
  body.innerHTML = SCHEDULE.map(row => `
    <tr>

      <td>${topicCell(row)}</td>
      <td>${requiredCell(row)}</td>
      <td>${plainCell(row.presenter)}</td>
      <td>${plainCell(row.optional)}</td>
    </tr>`).join("");
})();
